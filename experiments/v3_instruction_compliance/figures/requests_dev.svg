<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">V3 Arm A (pilot, development tasks): tool requests and turn-1 time by policy cell</title>
<desc id="d">15 valid of 15 planned episodes. Left: episodes whose first reply requested fit_line, per policy cell and stratum. Right: median seconds of the first call on 120-point tasks.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a37;--s1:#3987e5;--s2:#d95926}}
text{fill:var(--ink2);font-size:12px}.h{fill:var(--ink);font-size:16px;font-weight:600}.sub{font-size:12.5px}
.p{fill:var(--ink);font-size:13px;font-weight:600}.g{stroke:var(--grid);stroke-width:1}.b1{fill:var(--s1)}.b2{fill:var(--s2)}
.lab{fill:var(--ink);font-size:11.5px;font-weight:600}.small{font-size:10.5px}
</style>
<rect width="860" height="430" fill="var(--surface)"/>
<text class="h" x="24" y="28">Does a policy sentence stop the tool request? (pilot, development tasks)</text>
<text class="sub" x="24" y="48">claude-fable-5-1 through the Claude Code CLI, effort high. 15 valid of 15 planned episodes; 30 calls. The tool is described in every cell;</text>
<text class="sub" x="24" y="64">one policy sentence differs. Cells C (permission NO) and D prohibit the request. Three tasks, one repetition: descriptive only.</text>
