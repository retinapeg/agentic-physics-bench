<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">V2 (dev): proportion correct by difficulty group and tool condition</title>
<desc id="d">18 of 18 planned episodes attempted; 18 valid. Bars show correct episodes divided by planned episodes per group and condition; the label on each bar is the count. Under the optional-tool bars: requests and executions; under the required-tool bars: compliant episodes.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#3a3a37;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
text{fill:var(--ink2);font-size:12px}.h{fill:var(--ink);font-size:16px;font-weight:600}.sub{font-size:12.5px}
.g{stroke:var(--grid);stroke-width:1}.b1{fill:var(--s1)}.b2{fill:var(--s2)}.b3{fill:var(--s3)}
.lab{fill:var(--ink);font-size:11.5px;font-weight:600}.small{font-size:10.5px}
</style>
<rect width="760" height="440" fill="var(--surface)"/>
<text class="h" x="64" y="28">Correct episodes by difficulty and tool condition (dev split)</text>
<text class="sub" x="64" y="48">Claude Code CLI, claude-opus-5, effort high; ±0.01 m/s² of the least-squares slope; final answer after two turns. All groups: no tool 6/6, optional tool 6/6, required tool 6/6.</text>
<text class="sub" x="64" y="66">Optional tool requested 6/6 valid episodes; required-tool compliance 6/6. 18/18 planned episodes attempted.</text>
<text class="sub" x="64" y="84">A deterministic least-squares solver scores 6/6 tasks with zero error.</text>
