name: offline checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the freeze check reads the release tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: V1 and V2 offline checks (standard library only; no model calls)
        run: >
          python3 -m unittest
          tests.test_ls_slope tests.test_tasks tests.test_evaluate tests.test_agent tests.test_controls tests.test_analyze
          tests.test_v2_tasks tests.test_v2_agent tests.test_v2_run tests.test_v2_analyze tests.test_v2_pipeline
      - name: Regenerated data and analysis match the committed files
        run: |
          python3 src/tasks.py && python3 src/tasks.py scored
          python3 src/tasks_v2.py && python3 src/tasks_v2.py scored
          python3 src/analyze.py && python3 src/chart.py
          python3 src/analyze_v2.py dev && python3 src/chart_v2.py dev
          if [ -f results/v2/episodes_scored.jsonl ]; then python3 src/analyze_v2.py scored && python3 src/chart_v2.py scored; fi
          git status --short data/ results/
          test -z "$(git status --short data/ results/)"
      - name: Freeze manifests (the CLI version check needs the CLI, so hashes only)
        # Each manifest must match its release tag byte for byte. At HEAD, frozen prompts and data must be
        # byte-identical to the tag, and frozen modules must have the same code (module docstrings may differ).
        run: |
          python3 - <<'PY'
          import ast, hashlib, json, subprocess
          from pathlib import Path

          def code(src):
              tree = ast.parse(src)
              for node in ast.walk(tree):
                  body = getattr(node, "body", None)
                  if isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)) and body \
                          and isinstance(body[0], ast.Expr) and isinstance(body[0].value, ast.Constant) \
                          and isinstance(body[0].value.value, str):
                      node.body = body[1:]
              return ast.dump(tree)

          for manifest, tag in (("data/freeze_manifest.json", "v1.0.0"), ("data/v2/freeze_manifest.json", "v2.0.0")):
              m = json.loads(Path(manifest).read_text())
              bad = []
              for rel, digest in m["sha256"].items():
                  frozen = subprocess.run(["git", "show", f"{tag}:{rel}"], capture_output=True, check=True).stdout
                  head = Path(rel).read_bytes()
                  if hashlib.sha256(frozen).hexdigest() != digest:
                      bad.append(f"{tag}:{rel}")
                  if head != frozen and not (rel.endswith(".py") and code(head) == code(frozen)):
                      bad.append(rel)
              assert not bad, bad
              print(f"{manifest}: {len(m['sha256'])} files match {tag}; frozen code unchanged at HEAD")
          PY
