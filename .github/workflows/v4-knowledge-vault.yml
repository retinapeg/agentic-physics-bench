name: V4 Knowledge Vault offline checks
on:
  push:
  pull_request:
jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s experiments/v4_knowledge_vault/tests -v
      - run: node --check experiments/v4_knowledge_vault/web/app.js
